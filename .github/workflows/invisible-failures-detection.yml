name: Detección de Fallas Invisibles

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    # Ejecutar análisis completo cada lunes a las 2 AM
    - cron: '0 2 * * 1'

env:
  NODE_VERSION: '18'
  VERBOSE: 'true'

jobs:
  validate-file-inventory:
    name: Validar Inventario de Archivos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Instalar dependencias
        run: npm ci
        
      - name: Validar inventario de archivos
        run: node cicd-preventive-rules.js validate
        
      - name: Subir reporte de validación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cicd-validation-report
          path: cicd-validation-report-*.json
          retention-days: 30

  forced-substitution-tests:
    name: Tests de Sustitución Forzada
    runs-on: ubuntu-latest
    needs: validate-file-inventory
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Instalar dependencias
        run: npm ci
        
      - name: Generar análisis de archivos no referenciados
        run: |
          if [ -f "review-unreferenced-files.ps1" ]; then
            pwsh -File review-unreferenced-files.ps1 -Mode report
          fi
        
      - name: Ejecutar tests de sustitución forzada
        run: |
          if [ -f "unreferenced-files-analysis-*.json" ]; then
            ANALYSIS_FILE=$(ls unreferenced-files-analysis-*.json | head -1)
            node forced-substitution-test.js --batch --analysis "$ANALYSIS_FILE"
          else
            echo "No se encontró archivo de análisis, omitiendo tests de sustitución"
          fi
        
      - name: Subir reporte de sustitución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forced-substitution-report
          path: forced-substitution-report-*.json
          retention-days: 30

  bundle-analysis:
    name: Análisis de Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Instalar dependencias
        run: npm ci
        
      - name: Configurar análisis de bundle
        run: node bundle-analyzer-setup.js
        
      - name: Build del proyecto
        run: |
          if [ -f "package.json" ] && grep -q '"build"' package.json; then
            npm run build
          else
            echo "No se encontró script de build, omitiendo"
          fi
        
      - name: Detectar archivos obsoletos en bundle
        run: |
          if [ -f "detect-obsolete-in-bundle.js" ]; then
            node detect-obsolete-in-bundle.js
          fi
        
      - name: Subir reporte de bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analysis-report
          path: |
            bundle-analysis-report-*.json
            obsolete-files-report-*.json
          retention-days: 30

  e2e-clean-environment:
    name: Validación E2E en Entorno Limpio
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Instalar dependencias
        run: npm ci
        
      - name: Ejecutar validación E2E en entorno limpio
        run: node e2e-clean-environment-validator.js
        timeout-minutes: 30
        
      - name: Subir reporte E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-validation-report
          path: e2e-validation-report-*.json
          retention-days: 30

  runtime-analysis:
    name: Análisis de Runtime en Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.event_name == 'schedule'
    environment: staging
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Instalar dependencias
        run: npm ci
        
      - name: Configurar logging de staging
        run: node setup-staging-logger.js
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          
      - name: Subir reporte de runtime
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-analysis-report
          path: |
            runtime-module-report-*.json
            staging-logger-report-*.json
          retention-days: 30

  consolidate-reports:
    name: Consolidar Reportes
    runs-on: ubuntu-latest
    needs: [validate-file-inventory, forced-substitution-tests, bundle-analysis, e2e-clean-environment, runtime-analysis]
    if: always()
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        
      - name: Descargar todos los reportes
        uses: actions/download-artifact@v4
        with:
          path: reports/
          
      - name: Consolidar reportes
        run: |
          echo "# 📊 Reporte Consolidado de Detección de Fallas Invisibles" > consolidated-report.md
          echo "" >> consolidated-report.md
          echo "**Fecha:** $(date)" >> consolidated-report.md
          echo "**Commit:** ${{ github.sha }}" >> consolidated-report.md
          echo "**Branch:** ${{ github.ref_name }}" >> consolidated-report.md
          echo "" >> consolidated-report.md
          
          # Contar archivos de reporte
          TOTAL_REPORTS=$(find reports/ -name "*.json" | wc -l)
          echo "**Total de reportes generados:** $TOTAL_REPORTS" >> consolidated-report.md
          echo "" >> consolidated-report.md
          
          # Listar reportes por categoría
          echo "## 📋 Reportes Generados" >> consolidated-report.md
          echo "" >> consolidated-report.md
          
          for category in cicd-validation forced-substitution bundle-analysis e2e-validation runtime-analysis; do
            if [ -d "reports/${category}-report" ]; then
              echo "### ${category}" >> consolidated-report.md
              ls reports/${category}-report/ >> consolidated-report.md
              echo "" >> consolidated-report.md
            fi
          done
          
          # Verificar si hay violaciones críticas
          CRITICAL_VIOLATIONS=0
          if grep -r '"severity":"error"' reports/ > /dev/null 2>&1; then
            CRITICAL_VIOLATIONS=1
            echo "## 🚨 VIOLACIONES CRÍTICAS DETECTADAS" >> consolidated-report.md
            echo "" >> consolidated-report.md
            echo "Se encontraron violaciones críticas que requieren atención inmediata." >> consolidated-report.md
            echo "" >> consolidated-report.md
          fi
          
          echo "CRITICAL_VIOLATIONS=$CRITICAL_VIOLATIONS" >> $GITHUB_ENV
        
      - name: Comentar en PR (si aplica)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('consolidated-report.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
        
      - name: Subir reporte consolidado
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-report
          path: consolidated-report.md
          retention-days: 90
          
      - name: Fallar si hay violaciones críticas
        if: env.CRITICAL_VIOLATIONS == '1'
        run: |
          echo "❌ Se detectaron violaciones críticas. El pipeline falla para prevenir deployment."
          exit 1

  notify-teams:
    name: Notificar Equipos
    runs-on: ubuntu-latest
    needs: consolidate-reports
    if: failure() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: Notificar por Slack (opcional)
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{
              "text": "🚨 Fallas invisibles detectadas en ${{ github.repository }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Fallas invisibles detectadas* en `${{ github.repository }}`\n*Branch:* ${{ github.ref_name }}\n*Commit:* ${{ github.sha }}\n*Acción requerida:* Revisar reportes y corregir violaciones"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "Ver Pipeline"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }' \
            $SLACK_WEBHOOK_URL
      
      - name: Crear issue automático
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Fallas Invisibles Detectadas en Main',
              body: `## Resumen
              
              Se detectaron fallas invisibles en el branch main que requieren atención inmediata.
              
              **Commit:** ${context.sha}
              **Pipeline:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}
              
              ## Acciones Requeridas
              
              1. Revisar los reportes generados en el pipeline
              2. Corregir las violaciones críticas identificadas
              3. Ejecutar validación local antes del próximo commit
              4. Actualizar inventario de archivos si es necesario
              
              ## Reportes Disponibles
              
              Los reportes detallados están disponibles como artifacts en el pipeline de CI/CD.
              
              /cc @team-leads`,
              labels: ['bug', 'critical', 'invisible-failures']
            });